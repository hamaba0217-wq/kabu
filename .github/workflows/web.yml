name: 毎朝の運用候補をWeb公開

on:
  schedule:
    # 平日 07:30 JST（= 前日 22:30 UTC）。朝、市場が開く前に見られるように。
    - cron: "30 22 * * 0-4"
  workflow_dispatch:        # 手動実行ボタン（いつでも押せる）

permissions:
  contents: write           # 生成したHTMLをリポジトリに保存するため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 運用候補のHTMLを生成
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python main.py web-report

      - name: docs/index.html を公開用にコミット
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/ history/ || true
          git diff --staged --quiet || git commit -m "運用候補を更新 $(date +%F)"
          git push || true
