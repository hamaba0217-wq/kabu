name: 毎朝の運用候補をWeb公開

on:
  schedule:
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 運用候補のHTMLを生成
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python main.py web-report
      - name: 公開用にコミット
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html || true
          git diff --staged --quiet || git commit -m "運用候補を更新"
          git push || true
