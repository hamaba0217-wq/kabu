name: Daily Stock Screener Report

on:
  schedule:
    # 毎日日本時間の朝8時（UTC 23:00）に実行
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests jquants-api-client tabulate

      - name: Run Web Report Generator
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python main.py web-report

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git status
          git diff --staged --quiet || (git commit -m "Auto: Update daily report [skip ci]" && git push)
