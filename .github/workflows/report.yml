name: Daily Morning Stock Screening & Web Report

on:
  schedule:
    - cron: '0 22 * * 0-4'  # 株式市場の営業日前夜 (UTC 22:00 = JST 7:00)
  workflow_dispatch:        # 手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance jquants-api-client

      - name: Run python web_report.py
        run: python web_report.py
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          LIGHT_MODE: "1"

      - name: Commit and push changes to site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate daily stock report"
          branch: main
